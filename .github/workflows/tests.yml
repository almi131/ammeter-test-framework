name: tests
# Same suite on Ubuntu, Windows, and macOS. A green job is the only proof that OS passed.
# This workspace was checked on Linux only. Windows and macOS stay unverified until CI runs.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-plot.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke main.py
        run: python main.py
      - name: Smoke examples/run_tests.py
        run: python examples/run_tests.py
