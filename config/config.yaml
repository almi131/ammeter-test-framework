# Sampling rule: samples at t = i / sampling_frequency_hz inside the half-open window
# [0, total_duration_seconds), so measurements_count = ceil(duration * frequency).
# Fractional frequencies are fine (1 s at 2.5 Hz -> t = 0, 0.4, 0.8 -> 3 samples).
# Give at least two of the three (the third is derived); if all three are
# given and disagree, the run fails with a clear error.
testing:
  sampling:
    measurements_count: 20
    total_duration_seconds: 2.0
    sampling_frequency_hz: 10
  client_timeout_seconds: 3.0
  # Optional. Omit this section (or set enabled: false) so runs are not disturbed.
  # error_simulation:
  #   enabled: false
  #   seed: 1
  #   connection_failure: false   # bool, or a rate 0..1
  #   timeout: false
  #   invalid_response: false     # injects NaN; recorded as a per-sample error
  #   intermittent_failure: 0.0   # rate 0..1; random subset of samples fail
  # Optional known reference in amperes. Omit it to avoid an accuracy claim.
  # Relative error is (mean - reference) / reference. Zero is stored as null.
  # reference_current_a: 1.0

# To add a meter: add an entry here (and an emulator class in run_framework.py if emulated).
# Names: letters, digits, '_' and '-' only (used in file names). port: integer 1..65535.
ammeters:
  greenlee:
    host: localhost
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    host: localhost
    port: 5002
    command: "MEASURE_ENTES -get_data"
  circutor:
    host: localhost
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"

analysis:
  statistical_metrics: [mean, median, std_dev, min, max]
  visualization:
    enabled: true          # needs matplotlib (optional); skipped if missing
    plot_types: [time_series, boxplot]

result_management:
  results_dir: results/runs   # relative paths are resolved from the project root
